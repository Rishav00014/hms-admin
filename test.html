<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .categories,
        .subcategories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 10px;
            width: 200px;
            cursor: pointer;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>Category Viewer</h1>
        <div id="categories" class="categories"></div>
        <div id="subcategories" class="subcategories" style="margin-top: 20px;"></div>
    </div>
    <script>
        const BASE_URL = 'https://htnm-api.rishav.co.in/api';
        const LOGIN_API = `${BASE_URL}/auth/login`;
        const CATEGORY_API = `${BASE_URL}/menu/category`;

        let token = '';
        let level = 0;

        async function login() {
            try {
                const response = await fetch(LOGIN_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNo: '918210925188', password: '123456' }),
                });
                const data = await response.json();
                token = data.token;
                fetchCategories();
            } catch (error) {
                console.error('Login failed', error);
            }
        }

        async function fetchCategories() {
            try {
                const response = await fetch(CATEGORY_API, {
                    headers: { Authorization: `Bearer ${token}` },
                });
                const data = await response.json();
                level = data.data[0].screenLable.length -1;
                renderCategories(data.data);
            } catch (error) {
                console.error('Failed to fetch categories', error);
            }
        }

        async function fetchSubcategories(id) {
            try {
                let state = [];
                for (let i = 0; i < level; i++) {
                    if(i>0){
                        id = state[i - 1].element[0]._id;
                    }
                    const response = await fetch(`${CATEGORY_API}/${id}`, {
                        headers: { Authorization: `Bearer ${token}` },
                    });
                    const data = await response.json();
                    const subcategories = data.data;
                    state.push({ _id: id, element: subcategories });
                    
                    
                    console.log(state)
                }
                renderSubcategories(state);
            } catch (error) {
                console.error('Failed to fetch subcategories', error);
            }
        }

        function renderCategories(categories) {
            const container = document.getElementById('categories');
            container.innerHTML = '';
            categories.forEach((category) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${category.image}" alt="${category.title}">
                    <h3>${category.title}</h3>
                `;
                card.addEventListener('click', () => fetchSubcategories(category._id));
                container.appendChild(card);
            });
        }

        function renderSubcategories(subcategories) {
            const container = document.getElementById('subcategories');
            container.innerHTML = '';
            subcategories.forEach((sub,index) => {
                sub.element.forEach((subcategory) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    if(index==0){
                    card.innerHTML = `
                        <img src="${subcategory.image}" alt="${subcategory.title}">
                        <h3>${subcategory.title}</h3>
                    `;
                    }else{
                        
                    card.innerHTML = `
                        <h3>${subcategory.title}</h3>
                    `;
                    }
                    card.addEventListener('click', () => fetchSubcategories(subcategory._id));
                    container.appendChild(card);
                });
            });
        }

        login();
    </script>
</body>

</html>
